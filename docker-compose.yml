# Stack ROSITA — backend (Flask) + web (Nginx).
# As imagens são construídas a partir dos Dockerfiles (o código é copiado para
# dentro da imagem), então não é preciso compartilhar pastas no Docker Desktop.
# Subir:  docker compose up -d --build
# Derrubar: docker compose down
#
# O provedor de IA é externo (ex.: Ollama no host). Configure no .env:
#   ROSITA_OLLAMA_HOST=http://host.docker.internal:11434
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Ordem importa: o ÚLTIMO arquivo vence, então vai do mais genérico para o
    # mais específico. env.defaults e env.admin são versionados (padrões);
    # .env é a config local da máquina e precisa vencer os dois; backend/.env é
    # escrito pelo painel admin e pode ainda não existir (required: false).
    env_file:
      - path: backend/env.defaults
        required: false
      - path: backend/env.admin
        required: false
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      ROSITA_API_HOST: "0.0.0.0"
      ROSITA_API_PORT: "5000"
      # Necessário para o CORS liberar a origem do frontend na porta escolhida.
      ROSITA_WEB_PORT: ${ROSITA_WEB_PORT:-37642}
      ROSITA_DEBUG: ${ROSITA_DEBUG:-false}
      ROSITA_BUNDLED_DATA_DIR: "/app/backend/data"
      ROSITA_HISTORY_DB: "/data/rosita_history.sqlite3"
      # ATENÇÃO: NÃO declare aqui credenciais, hashes, chaves de API nem nada que
      # o painel admin salve. Tudo em `environment:` (a) passa pela interpolação
      # do Compose, que come os trechos "$..." de hashes scrypt, e (b) sobrepõe o
      # env_file, impedindo a config salva em backend/.env de valer. Esses
      # valores vêm exclusivamente dos arquivos listados em env_file.
      ROSITA_MAX_HISTORY: ${ROSITA_MAX_HISTORY:-5}
      ROSITA_MAX_INPUT_CHARS: ${ROSITA_MAX_INPUT_CHARS:-1000}
      ROSITA_NUM_PREDICT: ${ROSITA_NUM_PREDICT:-256}
      ROSITA_TEMPERATURE: ${ROSITA_TEMPERATURE:-0.75}
      ROSITA_TOP_P: ${ROSITA_TOP_P:-0.92}
      ROSITA_REPEAT_PENALTY: ${ROSITA_REPEAT_PENALTY:-1.08}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rosita_history:/data
    ports:
      - "${ROSITA_API_PORT:-18500}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/status', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - rosita_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ROSITA_WEB_PORT:-18888}:80"
    networks:
      - rosita_net

networks:
  rosita_net:
    driver: bridge

volumes:
  rosita_history:
